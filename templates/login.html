{% extends "base.html" %}
{% block titulo %}Entrar · Sekai{% endblock %}

{% block conteudo %}
  <h1>Bem-vindo de volta</h1>
  <p class="sub">Seu agente está esperando.</p>

  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

  <form method="post" novalidate>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" autofocus required>

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
  </form>

  <p class="rodape">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar</a></p>
{% endblock %}
